services:
  rabbitmq:
    image: rabbitmq:3-management
    # somehow fixes .erlang.cookie access issue at first launch
    user: rabbitmq
    ports:
      - "${RMQ_AMQP_PORT:-5672}:5672"     # AMQP port for Python services
      - "${RMQ_UI_PORT:-15672}:15672"   # RabbitMQ management UI (optional)
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_logs:/var/log/rabbitmq/
    restart: unless-stopped

volumes:
  rabbitmq_data:
  rabbitmq_logs:
